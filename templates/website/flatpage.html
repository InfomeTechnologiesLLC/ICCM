{% extends "base.html" %}
{% block title %}{{ page.seo_title|default:page.title }} — {{ site_settings.site_name }}{% endblock %}
{% block meta_description %}{{ page.seo_description }}{% endblock %}

{% block content %}
<section class="page-hero">
  <div class="shell" style="padding-block:2.5rem 3rem;">
    <h1 class="headline-xl mb-3">{{ page.title }}</h1>
  </div>
</section>
<section class="section">
  <div class="shell">
    <div class="row justify-content-center">
      <div class="col-lg-8 body-md text-muted-warm">{{ page.content|safe }}</div>
    </div>
  </div>
</section>
{% endblock %}
